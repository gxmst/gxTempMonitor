name: Release candidates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate:
    name: Test and audit source
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore locked dependencies with audit
        run: >-
          dotnet restore TempMonitor.Tests/TempMonitor.Tests.csproj
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build and test release configuration
        run: dotnet test TempMonitor.Tests/TempMonitor.Tests.csproj -c Release --no-restore --warnaserror

  publish:
    name: ${{ matrix.artifact }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: FrameworkDependent-x64
            artifact: gxTempMonitor-framework-dependent-win-x64
            output: publish/framework-dependent/win-x64
          - profile: FrameworkDependent-arm64
            artifact: gxTempMonitor-framework-dependent-win-arm64
            output: publish/framework-dependent/win-arm64
          - profile: SelfContained-x64
            artifact: gxTempMonitor-self-contained-win-x64
            output: publish/self-contained/win-x64
          - profile: SelfContained-arm64
            artifact: gxTempMonitor-self-contained-win-arm64
            output: publish/self-contained/win-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore locked dependencies with audit
        run: >-
          dotnet restore TempMonitor/TempMonitor.csproj
          --locked-mode
          -p:PublishProfile=${{ matrix.profile }}
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Verify tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (dotnet msbuild TempMonitor/TempMonitor.csproj -getProperty:Version -nologo).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match project version 'v$version'."
          }

      - name: Publish candidate
        run: >-
          dotnet publish TempMonitor/TempMonitor.csproj
          -c Release
          -p:PublishProfile=${{ matrix.profile }}
          --no-restore
          --warnaserror
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Install pinned Microsoft SBOM tool
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'sbom-tool'
          dotnet tool install --tool-path $toolPath Microsoft.Sbom.DotNetTool --version 4.1.5
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate SBOM and SHA-256 checksums
        shell: pwsh
        run: |
          $version = (dotnet msbuild TempMonitor/TempMonitor.csproj -getProperty:Version -nologo).Trim()
          $timestamp = (git show -s --format=%cI).Trim()
          ./release/New-ReleaseEvidence.ps1 `
            -ArtifactDirectory '${{ matrix.output }}' `
            -PackageVersion $version `
            -GenerationTimestamp $timestamp

      - name: Attest executable build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: ${{ matrix.output }}/gxTempMonitor.exe

      # These are deliberately labelled unsigned. If a release is signed later,
      # regenerate its provenance, SBOM and checksums as documented in release/SIGNING.md.
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate:
    name: Build, test and audit
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore and audit dependencies
        shell: pwsh
        run: >-
          dotnet restore TempMonitor/TempMonitor.csproj
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: List vulnerable transitive dependencies
        run: dotnet list TempMonitor/TempMonitor.csproj package --vulnerable --include-transitive --no-restore

      - name: Build release configuration
        run: dotnet build TempMonitor/TempMonitor.csproj -c Release --no-restore --warnaserror

      - name: Run test projects when present
        shell: pwsh
        run: |
          $testProjects = @(
            Get-ChildItem -Path . -Recurse -Filter '*Tests.csproj' |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' }
          )

          if ($testProjects.Count -eq 0) {
            Write-Host 'No test project exists yet.'
            exit 0
          }

          foreach ($project in $testProjects) {
            dotnet restore $project.FullName `
              --locked-mode `
              -p:NuGetAudit=true `
              -p:NuGetAuditMode=all `
              -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet test $project.FullName -c Release --no-restore --warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
